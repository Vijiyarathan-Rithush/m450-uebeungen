name: Tests

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

defaults:
  run:
    working-directory: 04-bie

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/BIE.UnitTests -c Release --logger trx --results-directory TestResults/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: 04-bie/TestResults/
          if-no-files-found: error

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/BIE.IntegrationTests -c Release --logger trx --results-directory TestResults/integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: 04-bie/TestResults/
          if-no-files-found: error

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Browser prüfen
        run: google-chrome --version
      - run: dotnet test tests/BIE.E2ETests -c Release --logger trx --results-directory TestResults/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: 04-bie/TestResults/
          if-no-files-found: error
